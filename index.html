<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今晚开黑？</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, "Microsoft YaHei", sans-serif; background: #0f0f1a; color: #e0e0e0; min-height: 100vh; }
        .container { max-width: 520px; margin: 0 auto; padding: 16px; }

        .header { text-align: center; padding: 24px 0 16px; }
        .header h1 { font-size: 26px; background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header .date { color: #888; font-size: 14px; margin-top: 4px; }
        .header .my-name { margin-top: 10px; display: flex; gap: 8px; justify-content: center; }
        .header .my-name input { padding: 6px 12px; border-radius: 8px; border: 1px solid #333; background: #1a1a2e; color: #e0e0e0; font-size: 14px; width: 120px; outline: none; }
        .header .my-name input:focus { border-color: #667eea; }
        .header .my-name button { padding: 6px 14px; border-radius: 8px; border: none; background: #667eea; color: #fff; cursor: pointer; font-size: 13px; }
        .header .my-name .saved { color: #4ade80; font-size: 13px; line-height: 34px; }

        .stats { display: flex; gap: 12px; margin-bottom: 20px; }
        .stats .card { flex: 1; background: #1a1a2e; border-radius: 12px; padding: 14px; text-align: center; }
        .stats .num { font-size: 28px; font-weight: bold; color: #667eea; }
        .stats .num.on { color: #4ade80; }
        .stats .num.off { color: #f87171; }
        .stats .label { font-size: 12px; color: #888; margin-top: 4px; }

        .rank-section { background: #1a1a2e; border-radius: 12px; padding: 16px; margin-bottom: 20px; }
        .rank-section .title { font-size: 15px; font-weight: bold; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .rank-section .title .clear-btn { font-size: 12px; color: #888; cursor: pointer; background: none; border: none; }
        .rank-section .title .clear-btn:hover { color: #f87171; }
        .rank-item { display: flex; align-items: center; padding: 8px 0; border-bottom: 1px solid #222; }
        .rank-item:last-child { border-bottom: none; }
        .rank-item .pos { width: 24px; height: 24px; border-radius: 50%; text-align: center; line-height: 24px; font-size: 12px; font-weight: bold; margin-right: 10px; flex-shrink: 0; }
        .rank-item .pos.gold { background: #f59e0b; color: #000; }
        .rank-item .pos.silver { background: #9ca3af; color: #000; }
        .rank-item .pos.bronze { background: #b45309; color: #fff; }
        .rank-item .pos.normal { background: #333; color: #888; }
        .rank-item .gname { flex: 1; font-size: 14px; }
        .rank-item .gvotes { font-size: 13px; color: #667eea; font-weight: bold; }

        .section-title { font-size: 15px; font-weight: bold; margin-bottom: 10px; }
        .player { background: #1a1a2e; border-radius: 12px; padding: 12px 16px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; }
        .player .avatar { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; flex-shrink: 0; }
        .player .avatar.on { background: #1a3a2a; color: #4ade80; border: 2px solid #4ade80; }
        .player .avatar.off { background: #3a1a1a; color: #f87171; border: 2px solid #f87171; }
        .player .avatar.undecided { background: #2a2a3a; color: #888; border: 2px solid #444; }
        .player .info { flex: 1; min-width: 0; }
        .player .name { font-size: 15px; font-weight: bold; }
        .player .name .me-tag { font-size: 11px; color: #667eea; margin-left: 6px; }
        .player .status { font-size: 12px; margin-top: 2px; }
        .player .status.on { color: #4ade80; }
        .player .status.off { color: #f87171; }
        .player .status.undecided { color: #888; }
        .player .actions { display: flex; gap: 8px; flex-shrink: 0; }
        .player .actions button { padding: 6px 16px; border-radius: 20px; border: none; font-size: 13px; cursor: pointer; transition: 0.2s; }
        .btn-play { background: #1a3a2a; color: #4ade80; border: 1px solid #4ade80 !important; }
        .btn-play:hover, .btn-play.active { background: #4ade80; color: #000; }
        .btn-pass { background: #3a1a1a; color: #f87171; border: 1px solid #f87171 !important; }
        .btn-pass:hover, .btn-pass.active { background: #f87171; color: #000; }

        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; }
        .overlay.show { display: block; }
        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); background: #1a1a2e; border-radius: 16px; padding: 24px; width: 90%; max-width: 400px; z-index: 101; }
        .modal.show { display: block; }
        .modal h3 { margin-bottom: 16px; font-size: 17px; }
        .modal .games-list { max-height: 240px; overflow-y: auto; margin-bottom: 16px; }
        .modal .game-option { display: flex; align-items: center; padding: 10px 0; border-bottom: 1px solid #222; cursor: pointer; }
        .modal .game-option:hover { color: #667eea; }
        .modal .game-option input { margin-right: 12px; accent-color: #667eea; }
        .modal .game-option label { font-size: 14px; cursor: pointer; flex: 1; }
        .modal .game-option .gvotes-sm { font-size: 12px; color: #888; }
        .modal .custom-input { display: flex; gap: 8px; margin-top: 12px; }
        .modal .custom-input input { flex: 1; padding: 8px 12px; border-radius: 8px; border: 1px solid #333; background: #0f0f1a; color: #e0e0e0; font-size: 14px; outline: none; }
        .modal .custom-input input:focus { border-color: #667eea; }
        .modal .custom-input button { padding: 8px 16px; border-radius: 8px; border: none; background: #667eea; color: #fff; cursor: pointer; }
        .modal-actions { display: flex; gap: 8px; margin-top: 16px; justify-content: flex-end; }
        .modal-actions button { padding: 8px 20px; border-radius: 8px; border: none; cursor: pointer; font-size: 14px; }
        .modal-actions .confirm { background: #667eea; color: #fff; }
        .modal-actions .confirm:hover { background: #818cf8; }
        .modal-actions .cancel { background: #333; color: #aaa; }
        .modal-actions .cancel:hover { color: #fff; }

        .tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; margin-left: 6px; }
        .tag.live { background: #4ade80; color: #000; }
        .tag.voted { background: #667eea; color: #fff; }

        .empty { text-align: center; padding: 40px 0; color: #555; font-size: 14px; }

        .conclusion { background: linear-gradient(135deg, #1a1a2e, #16213e); border-radius: 12px; padding: 16px; margin-bottom: 20px; text-align: center; }
        .conclusion .big { font-size: 22px; font-weight: bold; margin-bottom: 6px; }
        .conclusion .big.yes { color: #4ade80; }
        .conclusion .big.no { color: #f87171; }
        .conclusion .sub { font-size: 13px; color: #888; }

        .footer { text-align: center; padding: 20px 0; color: #444; font-size: 12px; }
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 24px; border-radius: 8px; font-size: 14px; z-index: 200; display: none; }
    </style>
</head>
<body>

<div class="toast" id="toast"></div>

<div class="container">
    <div class="header">
        <h1>今晚开黑？</h1>
        <div class="date" id="today"></div>
        <div class="my-name" id="nameBox">
            <input type="text" id="nameInput" placeholder="输入你的名字" maxlength="10">
            <button onclick="setMyName()">确定</button>
        </div>
    </div>

    <div class="conclusion" id="conclusion">
        <div class="big" id="conclusionText">加载中...</div>
        <div class="sub" id="conclusionSub"></div>
    </div>

    <div class="stats">
        <div class="card"><div class="num on" id="playCount">0</div><div class="label">来的</div></div>
        <div class="card"><div class="num off" id="passCount">0</div><div class="label">有事的</div></div>
        <div class="card"><div class="num" id="totalCount">0</div><div class="label">总人数</div></div>
    </div>

    <div class="unavail-section" id="unavailSection" style="background:#1a1a2e;border-radius:12px;padding:16px;margin-bottom:20px;display:none;">
    <div class="title" style="font-size:15px;font-weight:bold;margin-bottom:12px;">😴 来不了的人</div>
    <div id="unavailList"></div>
</div>

<div class="rank-section">
        <div class="title">
            <span>🎮 游戏投票排名</span>
            <button class="clear-btn" onclick="clearAllVotes()">清空投票</button>
        </div>
        <div id="rankList"></div>
    </div>

    <div class="section-title">👥 名单</div>
    <div id="playerList"></div>
    <div class="footer">数据实时同步，刷新页面自动更新</div>
</div>

<div class="overlay" id="voteOverlay" onclick="closeVoteModal()"></div>
<div class="modal" id="voteModal">
    <h3 id="voteTitle">选择想玩的游戏</h3>
    <div class="games-list" id="voteGames"></div>
    <div class="custom-input">
        <input type="text" id="customGame" placeholder="输入自定义游戏..." maxlength="20">
        <button onclick="addCustomGame()">添加</button>
    </div>
    <div class="modal-actions">
        <button class="cancel" onclick="closeVoteModal()">取消</button>
        <button class="confirm" onclick="confirmVote()">确定</button>
    </div>
</div>

<script>
// ======== Supabase 初始化 ========
const SUPABASE_URL = 'https://ebxaxxsbkcfhmdlueluy.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVieGF4eHNia2NmaG1kbHVlbHV5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4MzQyMDEsImV4cCI6MjA5NjQxMDIwMX0.GRr1FMdfWIKS2IL_gCXuV6Oao3g8czTbmXwJyeSmb_E';
const { createClient } = supabase;
const _supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

// ======== 状态 ========
let myName = localStorage.getItem('gn_my_name') || '';
let players = [];
let games = [];
let votingPlayer = '';

function getTodayStr() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function getTodayDisplay() {
    const d = new Date();
    const week = ["日","一","二","三","四","五","六"];
    return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 星期${week[d.getDay()]}`;
}

// ======== 从数据库加载数据 ========
async function loadData() {
    const today = getTodayStr();

    // 加载今天的玩家
    const { data: pData } = await _supabase.from('players').select('*').eq('date', today);
    players = pData || [];

    // 加载游戏列表
    const { data: gData } = await _supabase.from('games').select('*').order('id');
    games = gData || [];

    // 确保自己存在
    if (myName) {
        const exists = players.find(p => p.name === myName);
        if (!exists) {
            const { data: newP } = await _supabase.from('players').insert({ name: myName, status: 'undecided', vote: null, date: today }).select();
            if (newP) players = players.concat(newP);
        }
    }

    refresh();
}

// ======== 保存自己的状态 ========
async function saveMyStatus(status, note) {
    if (!myName) return;
    const today = getTodayStr();
    const payload = { name: myName, status, date: today };
    if (note !== undefined) payload.note = note;
    const { data } = await _supabase.from('players').upsert(payload).select();
    if (data) {
        const idx = players.findIndex(p => p.name === myName);
        if (idx >= 0) players[idx] = data[0];
        else players.push(data[0]);
    }
    refresh();
}

// ======== 保存投票 ========
async function saveMyVote(vote) {
    if (!myName) return;
    const today = getTodayStr();
    const { data } = await _supabase.from('players').upsert({ name: myName, status: 'play', vote, date: today }).select();
    if (data) {
        const idx = players.findIndex(p => p.name === myName);
        if (idx >= 0) players[idx] = data[0];
        else players.push(data[0]);
    }
    refresh();
}

// ======== 添加自定义游戏到数据库 ========
async function addGameToDB(name) {
    const { data } = await _supabase.from('games').insert({ name }).select();
    if (data) games = games.concat(data);
    refresh();
}

// ======== 删除玩家（只能删自己的） ========
async function removeMyself() {
    if (!myName) return;
    const today = getTodayStr();
    await _supabase.from('players').delete().eq('name', myName).eq('date', today);
    players = players.filter(p => p.name !== myName);
    localStorage.removeItem('gn_my_name');
    myName = '';
    document.getElementById('nameInput').value = '';
    document.getElementById('nameBox').innerHTML = `
        <input type="text" id="nameInput" placeholder="输入你的名字" maxlength="10">
        <button onclick="setMyName()">确定</button>
    `;
    refresh();
}

// ======== 清空所有投票 ========
async function clearAllVotes() {
    if (!confirm('清空所有人的投票？')) return;
    const today = getTodayStr();
    const { data } = await _supabase.from('players').update({ vote: null }).eq('date', today).neq('status', 'pass').select();
    if (data) {
        data.forEach(u => {
            const p = players.find(x => x.name === u.name);
            if (p) p.vote = null;
        });
    }
    refresh();
}

// ======== 设置名字 ========
function setMyName() {
    const input = document.getElementById('nameInput');
    const name = input.value.trim();
    if (!name || name.length > 10) return;
    myName = name;
    localStorage.setItem('gn_my_name', name);
    document.getElementById('nameBox').innerHTML = `<span class="saved">✅ 你是 ${name} <span style="color:#667eea;cursor:pointer;font-size:12px;margin-left:8px;" onclick="showRename()">[修改名称]</span></span>`;
    loadData();
}

// ======== 界面渲染 ========
function refresh() {
    renderUnavail();
    document.getElementById('today').textContent = getTodayDisplay();

    const play = players.filter(p => p.status === 'play');
    const pass = players.filter(p => p.status === 'pass');
    const undecided = players.filter(p => p.status === 'undecided' || !p.status);

    document.getElementById('playCount').textContent = play.length;
    document.getElementById('passCount').textContent = pass.length;
    document.getElementById('totalCount').textContent = players.length;

    // 结论
    renderConclusion(play.length, pass.length);

    // 排名
    renderRank();

    // 玩家列表
    renderPlayerList(play, undecided, pass);
}


function renderRank() {
    const container = document.getElementById('rankList');
    const voteCounts = {};
    players.filter(p => p.vote).forEach(p => { voteCounts[p.vote] = (voteCounts[p.vote] || 0) + 1; });
    const sorted = Object.entries(voteCounts).sort((a, b) => b[1] - a[1]);

    if (sorted.length === 0) {
        container.innerHTML = '<div style="text-align:center;color:#555;padding:10px 0;">还没有投票～</div>';
        return;
    }

    container.innerHTML = sorted.map(([game, count], i) => {
        let cls = 'normal';
        if (i === 0) cls = 'gold';
        else if (i === 1) cls = 'silver';
        else if (i === 2) cls = 'bronze';
        return '<div class="rank-item"><div class="pos ' + cls + '">' + (i+1) + '</div><span class="gname">' + game + '</span><span class="gvotes">' + count + '票</span></div>';
    }).join('');
}

function renderConclusion(playCount, passCount) {
    const big = document.getElementById('conclusionText');
    const sub = document.getElementById('conclusionSub');

    if (players.length === 0) {
        big.textContent = '等人齐';
        big.className = 'big';
        sub.textContent = '输入名字加入队伍';
        return;
    }

    const voteCounts = {};
    players.filter(p => p.vote).forEach(p => { voteCounts[p.vote] = (voteCounts[p.vote] || 0) + 1; });
    const sorted = Object.entries(voteCounts).sort((a, b) => b[1] - a[1]);

    if (playCount === 0) {
        big.textContent = '今天都没空 😴';
        big.className = 'big';
        sub.textContent = '休养生息，明天再战';
    } else if (playCount === 1) {
        big.textContent = `就位1人，等你来战`;
        big.className = 'big yes';
        sub.textContent = sorted.length ? `目前想玩：${sorted[0][0]}` : '还没定游戏';
    } else {
        big.textContent = `🔥 ${playCount}人到位，开整！`;
        big.className = 'big yes';
        sub.textContent = sorted.length ? `最高票游戏：${sorted[0][0]}（${sorted[0][1]}票）` : '还没定游戏';
    }
}

function renderUnavail() {
    const section = document.getElementById('unavailSection');
    const list = document.getElementById('unavailList');
    const passPlayers = players.filter(p => p.status === 'pass');
    if (passPlayers.length === 0) {
        section.style.display = 'none';
        return;
    }
    section.style.display = 'block';
    list.innerHTML = passPlayers.map(p => {
        const note = p.note ? ' <span style="color:#888;font-size:12px;margin-left:6px;">- ' + p.note + '</span>' : '';
        return '<div style="padding:6px 0;border-bottom:1px solid #222;font-size:14px;display:flex;justify-content:space-between;align-items:center;">' +
            '<span>' + p.name + note + '</span>' +
            (p.note ? '' : '') +
        '</div>';
    }).join('');

}

function renderPlayerList(play, undecided, pass) {
    const container = document.getElementById('playerList');
    if (players.length === 0) {
        container.innerHTML = '<div class="empty">输入名字加入队伍</div>';
        return;
    }

    const sorted = [...play, ...undecided, ...pass];
    container.innerHTML = sorted.map(p => {
        const isMe = p.name === myName;
        const noteHtml = p.status === 'pass' && p.note ? ` <span style=\"color:#888;font-size:12px;\">(${p.note})</span>` : '';
        const statusText = p.status === 'play' ? '来' : p.status === 'pass' ? '有事' : '还没定';
        const stCls = p.status === 'play' ? 'on' : p.status === 'pass' ? 'off' : 'undecided';
        const avCls = p.status === 'play' ? 'on' : p.status === 'pass' ? 'off' : 'undecided';
        const voteTag = p.vote ? `<span class="tag voted">🎮 ${p.vote}</span>` : '';
        const meTag = isMe ? '<span class="me-tag">（我）</span>' : '';
        const initials = p.name.charAt(0);

        return `
            <div class="player">
                <div class="avatar ${avCls}">${initials}</div>
                <div class="info">
                    <div class="name">${p.name}${meTag}${voteTag}</div>
                    <div class="status ${stCls}">${statusText}</div>
                </div>
                <div class="actions">
                    ${isMe ? `
                        ${p.vote ? `<button style="padding:6px 10px;border-radius:20px;border:1px solid #f87171;background:#3a1a1a;color:#f87171;font-size:12px;cursor:pointer;" onclick="revokeVote()">撤销</button>` : ''}
                        <button class="btn-play ${p.status === 'play' ? 'active' : ''}" onclick="setStatus('play')">来</button>
                        <button class="btn-pass ${p.status === 'pass' ? 'active' : ''}" onclick="setStatus('pass')">有事</button>
                    ` : ''}
                    <button style="background:none;border:none;color:#555;font-size:14px;cursor:pointer;padding:4px;" onclick="delPlayer('${p.name}')" title="移出">✕</button>
                </div>
            </div>
        `;
    }).join('');
}

// ======== 删除玩家 ========
async function delPlayer(name) {
    if (!confirm(`把 ${name} 移出今天的名单？`)) return;
    const today = getTodayStr();
    await _supabase.from('players').delete().eq('name', name).eq('date', today);
    players = players.filter(p => p.name !== name);
    refresh();
}

// ======== 设置自己状态 ========
function setStatus(status) {
    if (!myName) return;
    if (status === 'pass') {
        showNoteModal();
        return;
    }
    saveMyStatus(status);
    if (status === 'play') {
        setTimeout(() => showVoteModal(), 300);
    }
}

// ======== 撤销投票 ========
async function revokeVote() {
    if (!myName) return;
    const today = getTodayStr();
    const { data } = await _supabase.from('players').update({ vote: null }).eq('name', myName).eq('date', today).select();
    if (data) {
        const p = players.find(x => x.name === myName);
        if (p) p.vote = null;
    }
    refresh();
}

// ======== 投票弹窗 ========
function showVoteModal() {
    votingPlayer = myName;
    document.getElementById('voteTitle').textContent = '你想玩什么？';
    renderVoteGames();
    document.getElementById('voteOverlay').classList.add('show');
    document.getElementById('voteModal').classList.add('show');
}

function closeVoteModal() {
    votingPlayer = '';
    document.getElementById('voteOverlay').classList.remove('show');
    document.getElementById('voteModal').classList.remove('show');
}

function renderVoteGames() {
    const container = document.getElementById('voteGames');
    const me = players.find(p => p.name === myName);
    const cv = me ? me.vote : null;

    container.innerHTML = games.map(g => {
        const voters = players.filter(p => p.vote === g.name);
        return `
            <div class="game-option">
                <input type="radio" name="voteGame" value="${g.name}" id="vg_${g.id}" ${cv === g.name ? 'checked' : ''}>
                <label for="vg_${g.id}">${g.name}</label>
                <span class="gvotes-sm">${voters.length}票</span>
            </div>
        `;
    }).join('');
}

async function addCustomGame() {
    const input = document.getElementById('customGame');
    const name = input.value.trim();
    if (!name) return;
    if (games.find(g => g.name === name)) {
        document.querySelector(`input[value="${name}"]`)?.click();
        input.value = '';
        return;
    }
    await addGameToDB(name);
    renderVoteGames();
    document.querySelector(`input[value="${name}"]`).checked = true;
    input.value = '';
}

async function confirmVote() {
    const sel = document.querySelector('input[name="voteGame"]:checked');
    if (!sel) { closeVoteModal(); return; }
    await saveMyVote(sel.value);
    closeVoteModal();
}

// ======== 备注弹窗 ========

async function skipNote() {
    await saveMyStatus('pass', '');
    closeNoteModal();
}

function showNoteModal() {
    document.getElementById('noteOverlay').classList.add('show');
    document.getElementById('noteModal').classList.add('show');
    document.getElementById('noteInput').value = '';
    setTimeout(() => document.getElementById('noteInput').focus(), 100);
}

function closeNoteModal() {
    document.getElementById('noteOverlay').classList.remove('show');
    document.getElementById('noteModal').classList.remove('show');
}

async function rejectNote(name) {
    if (!confirm('确定拒绝 ' + name + ' 的备注？')) return;
    const today = getTodayStr();
    await _supabase.from('players').update({ note: '' }).eq('name', name).eq('date', today);
    const p = players.find(x => x.name === name);
    if (p) p.note = '';
    refresh();
}

async function confirmNote() {
    const note = document.getElementById('noteInput').value.trim();
    await saveMyStatus('pass', note || '');
    closeNoteModal();
}

// ======== 修改名称 ========
function showRename() {
    document.getElementById('nameBox').innerHTML = `
        <input type="text" id="renameInput" placeholder="输入新名字" maxlength="10" style="padding:6px 12px;border-radius:8px;border:1px solid #333;background:#1a1a2e;color:#e0e0e0;font-size:14px;width:120px;outline:none;">
        <button onclick="confirmRename()" style="padding:6px 14px;border-radius:8px;border:none;background:#667eea;color:#fff;cursor:pointer;font-size:13px;">确定</button>
        <button onclick="cancelRename()" style="padding:6px 14px;border-radius:8px;border:none;background:#333;color:#aaa;cursor:pointer;font-size:13px;">取消</button>
    `;
    document.getElementById('renameInput').focus();
}

function cancelRename() {
    document.getElementById('nameBox').innerHTML = '<span class="saved">✅ 你是 ' + myName + ' <span style="color:#667eea;cursor:pointer;font-size:12px;margin-left:8px;" onclick="showRename()">[修改名称]</span></span>';
}

async function confirmRename() {
    const newName = document.getElementById('renameInput').value.trim();
    if (!newName || newName.length > 10) return;
    if (newName === myName) { cancelRename(); return; }

    const today = getTodayStr();
    await _supabase.from('players').delete().eq('name', myName).eq('date', today);
    const me = players.find(p => p.name === myName);
    const status = me ? me.status : 'undecided';
    const vote = me ? me.vote : null;
    await _supabase.from('players').insert({ name: newName, status, vote, date: today });

    players = players.filter(p => p.name !== myName);
    myName = newName;
    localStorage.setItem('gn_my_name', newName);

    document.getElementById('nameBox').innerHTML = '<span class="saved">✅ 你是 ' + newName + ' <span style="color:#667eea;cursor:pointer;font-size:12px;margin-left:8px;" onclick="showRename()">[修改名称]</span></span>';
    loadData();
}

// ======== 自动刷新（每5秒拉最新数据） ========
setInterval(async () => {
    if (!myName) return;
    const today = getTodayStr();
    const [pRes, gRes] = await Promise.all([
        _supabase.from('players').select('*').eq('date', today),
        _supabase.from('games').select('*').order('id')
    ]);
    if (pRes.data) players = pRes.data;
    if (gRes.data) games = gRes.data;
    refresh();
    // 如果被别人删除了，重置回最初状态
    if (myName && !players.find(p => p.name === myName)) {
        localStorage.removeItem('gn_my_name');
        myName = '';
        document.getElementById('nameBox').innerHTML = '<input type="text" id="nameInput" placeholder="输入你的名字" maxlength="10" style="padding:6px 12px;border-radius:8px;border:1px solid #333;background:#1a1a2e;color:#e0e0e0;font-size:14px;width:120px;outline:none;"> <button onclick="setMyName()" style="padding:6px 14px;border-radius:8px;border:none;background:#667eea;color:#fff;cursor:pointer;font-size:13px;">确定</button>';
        refresh();
    }
}, 5000);

// ======== 初始化 ========
(async function init() {
    if (myName) {
        document.getElementById('nameBox').innerHTML = `<span class="saved">✅ 你是 ${myName} <span style="color:#667eea;cursor:pointer;font-size:12px;margin-left:8px;" onclick="showRename()">[修改名称]</span></span>`;
    }
    try { await loadData(); } catch(e) {
        console.error('Init error:', e);
        document.getElementById('conclusionText').textContent = '出错了，刷新试试';
    }
})();
</script>

<div class="overlay" id="noteOverlay" onclick="closeNoteModal()"></div>

    <h3>备注</h3>

    <div class="modal-actions">
        <button class="cancel" onclick="closeNoteModal()">取消</button>

        <button class="cancel" onclick="skipNote()" style="background:#333;color:#888;padding:8px 20px;border-radius:8px;border:none;cursor:pointer;font-size:14px;">拒绝备注</button>
    </div>
</div>
